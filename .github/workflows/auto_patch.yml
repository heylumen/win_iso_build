name: Windows ISO Auto Patch (All Versions)

on:
  # 定时轮询：每 6 小时检测一次 adavak/Win_ISO_Patching_Scripts 的 meta4 变化。
  # 微软发布新 Windows 构建后，社区会更新对应 *.meta4，本工作流的「Check if workflow should run」
  # 步骤比对 meta4 哈希，无变化则 skip（几乎零成本），有变化则自动拉取、构建并发布 Release。
  # 这样无需手动点 Actions，实现「微软更新 → 仓库自动制作发布」。
  # 注：若想更及时，可改为 "0 */3 * * *"（每 3 小时）。
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  SPLIT_SIZE: 2000m
  SEVENZIP: "C:\\Program Files\\7-Zip\\7z.exe"

concurrency:
  group: auto-patch
  cancel-in-progress: false

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # Cleanup old runs before starting (once per dispatch)
      - name: Cleanup old runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $api = "https://api.github.com/repos/${{ github.repository }}/actions/runs"

          # 删除带指数退避重试，规避 GitHub API 偶发 403 限流导致旧 run 残留
          function Remove-RunWithRetry($id, [int]$maxAttempts=4, [int]$baseDelay=15) {
            for ($i = 1; $i -le $maxAttempts; $i++) {
              try {
                Invoke-RestMethod -Method Delete -Uri "$api/$id" -Headers @{Authorization = "token $env:GH_TOKEN"} -ErrorAction Stop
                Write-Host "  OK delete $id"
                return $true
              } catch {
                $status = $_.Exception.Response.StatusCode.value__
                Write-Host "  FAIL delete $id (attempt $i/$maxAttempts, status=$status): $($_.Exception.Message)"
                if ($i -lt $maxAttempts) {
                  $delay = $baseDelay * [math]::Pow(2, $i-1)   # 15 / 30 / 60 秒
                  Start-Sleep -Seconds $delay
                }
              }
            }
            return $false
          }

          $all = gh run list --branch ${{ github.ref_name }} --json databaseId,conclusion,createdAt,updatedAt,startedAt,workflowName --limit 100 | ConvertFrom-Json
          Write-Host "Total runs: $($all.Count)"
          $deleted = New-Object 'System.Collections.Generic.HashSet[long]'
          # Delete failed/cancelled/timed_out — separate pass by age: old first
          $all | Where-Object { $_.conclusion -in @('failure','cancelled','timed_out') } | Sort-Object createdAt | ForEach-Object {
            Write-Host "Delete: $($_.databaseId)"; if (Remove-RunWithRetry $_.databaseId) { [void]$deleted.Add($_.databaseId) }
          }
          # Delete short-duration runs (< 3 min)
          $all | Where-Object { $_.updatedAt -and $_.startedAt -and ([DateTime]::Parse($_.updatedAt) - [DateTime]::Parse($_.startedAt)).TotalMinutes -lt 3 } | ForEach-Object {
            Write-Host "Delete short: $($_.databaseId)"; if (Remove-RunWithRetry $_.databaseId) { [void]$deleted.Add($_.databaseId) }
          }
          # Keep 10 newest from remaining
          $good = $all | Where-Object { $_.conclusion -notin @('failure','cancelled','timed_out') -and -not $deleted.Contains($_.databaseId) }
          Write-Host "Good runs after cleanup (keep 10 of $($good.Count))"
          $good | Select-Object -Skip 10 | ForEach-Object { Write-Host "Delete old: $($_.databaseId)"; Remove-RunWithRetry $_.databaseId }
          exit 0

      # Generate dynamic matrix from config
      - id: gen
        shell: pwsh
        run: |
          $cfg = Get-Content .github/version-config.json | ConvertFrom-Json -AsHashtable
          $matrix = @()
          foreach ($build in $cfg.versions.Keys) {
            $ver = $cfg.versions[$build]
            foreach ($locale in $cfg.locales) {
              $rel = $cfg.releases[$locale][$build]
              if (-not $rel) {
                Write-Host "Skip $($ver.name) ($locale) — no release data"
                continue
              }
              if (-not $rel.expected_hash) {
                Write-Host "Skip $($ver.name) ($locale) — expected_hash missing, fill it in version-config.json"
                continue
              }
              $meta4Build = $build -replace '_iot$', ''
              $matrix += [PSCustomObject]@{
                name          = "$($ver.name) ($locale)"
                release_tag   = $rel.release_tag
                iso_label     = $ver.iso_label
                expected_hash = $rel.expected_hash
                meta4_file    = "script_${meta4Build}_x64.meta4"
                build_major   = $meta4Build
                locale        = $locale
              }
            }
          }
          $json = $matrix | ConvertTo-Json -Compress -Depth 3
          Write-Host "Generated matrix: $json"
          "matrix=$json" >> $env:GITHUB_OUTPUT

  build:
    needs: generate-matrix
    strategy:
      matrix:
        version: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Start marker
      - name: Start workflow
        shell: pwsh
        run: Write-Host "Starting ${{ matrix.version.name }} Auto Patch workflow"

      # 2. Get latest meta4 file hash (order-independent) from Win_ISO_Patching_Scripts
      - name: Get patch script meta4 file hash
        id: script
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Invoke-RestMethodWithRetry([string]$uri, [int]$maxAttempts=5, [int]$delaySeconds=120) {
            for ($i = 1; $i -le $maxAttempts; $i++) {
              try {
                return Invoke-RestMethod -Uri $uri -Headers @{Authorization = "token $env:GH_TOKEN"}
              } catch {
                Write-Host "Invoke-RestMethod failed (attempt $i/$maxAttempts): $($_.Exception.Message)"
                if ($i -lt $maxAttempts) {
                  Write-Host "Retrying in $delaySeconds seconds..."
                  Start-Sleep -Seconds $delaySeconds
                } else {
                  throw
                }
              }
            }
          }

          $meta4 = Invoke-RestMethodWithRetry "https://api.github.com/repos/adavak/Win_ISO_Patching_Scripts/contents/Scripts/${{ matrix.version.meta4_file }}"
          $rawBytes = [Convert]::FromBase64String($meta4.content)
          $xmlText = [System.Text.Encoding]::UTF8.GetString($rawBytes)

          # legacy：仅基于 meta4 内部 file name 列表（排序拼接），历史兼容、便于平滑迁移
          $names = [regex]::Matches($xmlText, 'file name="([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          $sorted = $names | Sort-Object { [int]($_ -replace '^.*kb(\d+).*$', '$1') }
          $combined = $sorted -join '|'
          $legacyBytes = [System.Security.Cryptography.SHA256]::Create().ComputeHash([System.Text.Encoding]::UTF8.GetBytes($combined))
          $legacy = [System.BitConverter]::ToString($legacyBytes).Replace('-', '').ToLower()

          # content：基于 meta4 原始字节的 SHA256（内容级指纹，可捕获 file URL/校验和变化）
          $contentBytes = [System.Security.Cryptography.SHA256]::Create().ComputeHash($rawBytes)
          $content = [System.BitConverter]::ToString($contentBytes).Replace('-', '').ToLower()

          "legacy=$legacy" >> $env:GITHUB_OUTPUT
          "content=$content" >> $env:GITHUB_OUTPUT

      # 3. Read last meta4 hash（正文 STATE 注释为主，仓库内提交文件 .github/meta4-state.json 为次，防止正文被误改导致反复重建）
      - name: Read last meta4 hash
        id: last
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repo   = "${{ github.repository }}"
          $prefix = "${{ matrix.version.release_tag }}"

          $legacy = ""
          $v2 = ""

          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases?per_page=50" -Headers @{Authorization = "token $env:GH_TOKEN"}

            $matched = $releases |
              Where-Object { $_.tag_name -like "$prefix*" } |
              Sort-Object published_at -Descending |
              Select-Object -First 1

            if ($matched) {
              if ($matched.body -match 'META4_HASH_V2=([a-f0-9]{64})') { $v2 = $matches[1] }
              if ($matched.body -match 'META4_HASH=([a-f0-9]{64})') { $legacy = $matches[1] }

              # 次：从本地提交文件读取（防 Release 正文/资产均被误改；
              #     该文件位于仓库内、不在 Release 资产中，因此不会污染博客下载列表）
              $stateFile = Join-Path $env:GITHUB_WORKSPACE ".github/meta4-state.json"
              if (-not $v2 -and (Test-Path $stateFile)) {
                try {
                  $sf = Get-Content $stateFile | ConvertFrom-Json
                  $fk = $sf."${{ matrix.version.release_tag }}"
                  if ($fk) { $v2 = $fk }
                } catch { Write-Host "读取本地状态文件失败（忽略）: $($_.Exception.Message)" }
              }
            }
          } catch {
            Write-Host "读取上次哈希失败（视为无记录）: $($_.Exception.Message)"
          }

          "legacy=$legacy" >> $env:GITHUB_OUTPUT
          "v2=$v2" >> $env:GITHUB_OUTPUT

      - name: Check if workflow should run
        id: check
        shell: pwsh
        run: |
          $v2     = "${{ steps.last.outputs.v2 }}"
          $legacy = "${{ steps.last.outputs.legacy }}"
          $curV2  = "${{ steps.script.outputs.content }}"
          $curLeg = "${{ steps.script.outputs.legacy }}"

          $skip = $false
          if ($v2 -and $curV2 -eq $v2) {
            # 内容级指纹一致 → 无需构建
            $skip = $true
          } elseif (-not $v2 -and $legacy -and $curLeg -eq $legacy) {
            # 存量 Release 尚未写入 V2：回退到 legacy 判定，避免误触发重建
            $skip = $true
          }

          if ($skip) {
            Write-Host "meta4 未变化（v2=$v2），跳过构建"
            "run=false" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "检测到 meta4 变化，开始构建"
            "run=true" >> $env:GITHUB_OUTPUT
          }

      - name: Skip if no update
        if: steps.check.outputs.run == 'false'
        run: echo "No meta4 update for ${{ matrix.version.name }}, skip build."

      # 4. Prepare workspace
      - name: Prepare workspace
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path download, patcher, release

      # 5. Clone patch scripts (with retry to avoid hangs)
      - name: Clone patch scripts
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: |
          $maxAttempts = 5
          $delaySeconds = 120
          $repoUrl = 'https://github.com/adavak/Win_ISO_Patching_Scripts.git'
          for ($i = 1; $i -le $maxAttempts; $i++) {
            Write-Host "Cloning patch scripts (attempt $i/$maxAttempts)..."
            & git clone $repoUrl patcher
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Clone succeeded"
              break
            }
            Write-Host "git clone failed with exit code $LASTEXITCODE"
            if ($i -lt $maxAttempts) {
              Write-Host "Retrying in $delaySeconds seconds..."
              Start-Sleep -Seconds $delaySeconds
            } else {
              throw "git clone failed after $maxAttempts attempts"
            }
          }

      # 6. Download split ISO zip parts
      - name: Download ISO zip parts
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ProgressPreference = 'SilentlyContinue'
          function Invoke-RestMethodWithRetry([string]$uri, [int]$maxAttempts=5, [int]$delaySeconds=120) {
            for ($i = 1; $i -le $maxAttempts; $i++) {
              try {
                return Invoke-RestMethod -Uri $uri -Headers @{Authorization = "token $env:GH_TOKEN"}
              } catch {
                Write-Host "Invoke-RestMethod failed (attempt $i/$maxAttempts): $($_.Exception.Message)"
                if ($i -lt $maxAttempts) {
                  Write-Host "Retrying in $delaySeconds seconds..."
                  Start-Sleep -Seconds $delaySeconds
                } else {
                  throw
                }
              }
            }
          }

          $api = "https://api.github.com/repos/adavak/win_iso_zip/releases/tags/${{ matrix.version.release_tag }}"
          $json = Invoke-RestMethodWithRetry $api
          $parts = $json.assets | Where-Object { $_.name -match '\.zip\.\d+$' } | Sort-Object name
          if ($parts.Count -eq 0) { throw "No zip parts found for ${{ matrix.version.release_tag }}" }
          foreach ($p in $parts) {
            Invoke-WebRequest $p.browser_download_url -OutFile "download\$($p.name)"
          }

      # 7. Merge & extract using 7z
      - name: Extract ISO using 7z
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: |
          $sevenZip = "${{ env.SEVENZIP }}"
          if (-not (Test-Path $sevenZip)) { throw "7z.exe not found at $sevenZip" }
          & $sevenZip x "download\*.zip.001" -o"patcher" -y

      # 8. Verify original ISO SHA256
      - name: Verify ISO SHA256
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: |
          $sevenZip = "${{ env.SEVENZIP }}"
          $iso = Get-ChildItem patcher -Filter *.iso -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $iso) { throw "Original ISO not found" }

          $hashOutput = & $sevenZip h -scrcSHA256 "$($iso.FullName)"
          $hashMatches = $hashOutput | Select-String -Pattern '([a-fA-F0-9]{64})' | ForEach-Object { $_.Matches[0].Value }
          $actual = ($hashMatches | Select-Object -First 1).Trim().ToLower()
          if ($actual -ne "${{ matrix.version.expected_hash }}") { throw "SHA256 mismatch: $actual" }

      # 9. Run Start.cmd（上游 adavak/Win_ISO_Patching_Scripts 的菜单中 9 = 退出/完成；
      #    此处通过管道连续喂入 9 触发自动结束。注意：9 的具体语义依赖上游菜单定义（隐式契约）。
      #    加硬超时保护：若上游菜单变更导致 Start.cmd 挂起，最多运行 5h 后由 step 超时兜底，
      #    避免一直占用到 6h job 上限；超时即失败（不会创建半成品 Release）。
      - name: Run Start.cmd
        if: steps.check.outputs.run == 'true'
        shell: cmd
        timeout-minutes: 300
        run: |
          cd patcher
          (
            echo 9
            echo 9
            echo 9
          ) | Start.cmd

      # 10. Rename ISO and split using 7z
      - name: Rename ISO and split
        id: iso
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: |
          $sevenZip = "${{ env.SEVENZIP }}"
          $iso = Get-ChildItem patcher -Filter *.iso -Recurse | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $iso) { throw "原始 ISO 未生成，Start.cmd 可能未正常完成" }

          # 版本号（格式 X.Y，如 26200.8973）从 ISO 文件名解析；locale 直接取自矩阵配置（不再依赖文件名猜测）
          if ($iso.Name -match '(\d{5,6}\.\d{3,5})') {
            $versionBuild = $matches[1]
            $version, $build = $versionBuild -split '\.'
          } else {
            throw "无法从 ISO 文件名解析版本号: $($iso.Name)"
          }
          $locale = "${{ matrix.version.locale }}".ToLower()

          $date = Get-Date -Format "yyMMdd"
          $time = "0800"

          # 7z SHA256
          $hashOutput = & $sevenZip h -scrcSHA256 "$($iso.FullName)"
          $hashMatches = $hashOutput | Select-String -Pattern '([a-fA-F0-9]{64})' | ForEach-Object { $_.Matches[0].Value }
          $hash = ($hashMatches | Select-Object -First 1).Trim().ToLower()
          if (-not $hash -or $hash.Length -lt 8) { throw "无法从 7z 输出解析有效 SHA256" }
          $hash8 = $hash.Substring($hash.Length-8,8)

          $newName = "$version.$build.$date-$time.${{ matrix.version.iso_label }}_${locale}_$hash8.iso"
          Rename-Item -Path $iso.FullName -NewName $newName

          # Split using 7z
          & $sevenZip a "release\$newName.zip" "patcher\$newName" -v${{ env.SPLIT_SIZE }}

          $runTimeTag = (Get-Date).ToString("yyyyMMdd-HHmm")
          $tag = "${{ matrix.version.release_tag }}-$version.$build-$runTimeTag"
          $isoFile = "patcher\$newName"

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "iso_file=$isoFile" >> $env:GITHUB_OUTPUT
          "iso_sha256=$hash" >> $env:GITHUB_OUTPUT

      # 11. Create Git tag
      - name: Create Git tag
        if: steps.check.outputs.run == 'true'
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          $tag = "${{ steps.iso.outputs.tag }}"
          if (-not (git tag -l $tag)) {
            git tag $tag
            git push origin $tag
          }

      # 12. Create GitHub Release
      - name: Create Release
        if: steps.check.outputs.run == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.iso.outputs.tag }}
          name: ${{ steps.iso.outputs.tag }}
          body: |
            ISO SHA256: ${{ steps.iso.outputs.iso_sha256 }}

            <!-- STATE
            META4_HASH=${{ steps.script.outputs.legacy }}
            META4_HASH_V2=${{ steps.script.outputs.content }}
            -->
          files: release/*.zip.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 13. 通知博客仓库立即同步数据（可选增强）
      # 前置条件：仓库 Settings → Secrets 配置 HEXO_PAT（需具备 xfxx2022/hexo 的 repo 权限的 Personal Access Token）。
      # 未配置时不报错（continue-on-error），博客侧仍由每 6 小时定时任务兜底同步。
      - name: Notify blog repo to sync
        if: steps.check.outputs.run == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          HEXO_PAT: ${{ secrets.HEXO_PAT }}
        run: |
          if (-not $env:HEXO_PAT) { Write-Host "HEXO_PAT 未配置，跳过即时通知（博客将靠定时任务兜底同步）"; exit 0 }
          $api = "https://api.github.com/repos/xfxx2022/hexo/dispatches"
          $body = @{ event_type = "win_iso_updated" } | ConvertTo-Json -Compress
          try {
            Invoke-RestMethod -Method Post -Uri $api -Headers @{Authorization = "token $env:HEXO_PAT"; Accept = "application/vnd.github+json" } -Body $body -ContentType "application/json"
            Write-Host "已向博客仓库发送 win_iso_updated 事件，触发即时同步"
          } catch {
            Write-Host "通知博客失败（不影响本次构建）: $($_.Exception.Message)"
          }

  # 持久化 meta4 状态文件：与 Release 正文 STATE 注释互为备份，防止正文被误改导致反复重建。
  # 该文件位于仓库内、不进 Release 资产，因此不会污染博客下载列表。
  # 单 job 串行（配合 workflow 级 concurrency），无并行 push 冲突；失败不影响构建结果。
  persist-state:
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 写入 meta4 状态文件
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          function Get-ContentHash([string]$meta4) {
            $uri = "https://api.github.com/repos/adavak/Win_ISO_Patching_Scripts/contents/Scripts/$meta4"
            $m = Invoke-RestMethod -Uri $uri -Headers @{Authorization = "token $env:GH_TOKEN"}
            $raw = [Convert]::FromBase64String($m.content)
            $b = [System.Security.Cryptography.SHA256]::Create().ComputeHash($raw)
            return [System.BitConverter]::ToString($b).Replace('-', '').ToLower()
          }
          try {
            $cfg = Get-Content .github/version-config.json | ConvertFrom-Json -AsHashtable
            $state = @{}
            foreach ($build in $cfg.versions.Keys) {
              $meta4Build = $build -replace '_iot$', ''
              $file = "script_${meta4Build}_x64.meta4"
              foreach ($locale in $cfg.locales) {
                $rel = $cfg.releases[$locale][$build]
                if ($rel -and $rel.release_tag) { $state[$rel.release_tag] = Get-ContentHash $file }
              }
            }
            $state | ConvertTo-Json -Depth 2 | Set-Content -Path ".github/meta4-state.json" -Encoding utf8
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/meta4-state.json
            git commit -m "ci: 更新 meta4 状态文件" | Out-Null
            git pull --rebase origin ${{ github.ref_name }}
            git push
            Write-Host "已写入 .github/meta4-state.json（$(($state.Keys | Measure-Object).Count) 个条目）"
          } catch {
            Write-Host "写入状态文件失败（忽略，正文 STATE 仍为主）：$($_.Exception.Message)"
          }
